<style>
/* Layout: a classic Windows 2000-style application window on a desktop: menu bar, toolbar, tree pane + content pane, status bar. */
:root {
  color-scheme: light;
  --desk: #3a6ea5;
  --face: #d4d0c8;
  --face-2: #e4e1da;
  --hi: #ffffff;
  --sh: #808080;
  --dk: #404040;
  --ink: #000000;
  --mute: #4a4a4a;
  --win: #ffffff;
  --sel: #0a246a;
  --sel-ink: #ffffff;
  --t1: #0a246a;
  --t2: #a6caf0;
  --pos: #006400;
  --neg: #a00000;
  --warn: #8a6a00;
  --bar: #0a246a;
  --bar-2: #6f8fbf;
  --tip: #ffffe1;
  --ui: Tahoma, "Segoe UI", Verdana, "DejaVu Sans", Geneva, sans-serif;
  --mono: "Lucida Console", "Courier New", "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background: var(--desk); color: var(--ink);
  font: 12px/1.35 var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
button, input, select, textarea { font: inherit; color: var(--ink); }
.num, td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .mute { color: var(--mute); }

/* Bevels */
.raised { background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--sh), inset 2px 2px var(--face-2); }
.sunken { background: var(--win); box-shadow: inset 1px 1px var(--sh), inset 2px 2px var(--dk), inset -1px -1px var(--hi), inset -2px -2px var(--face-2); }

/* Window */
.window { max-width: 1180px; margin: 0 auto; padding: 3px; display: flex; flex-direction: column; }
.titlebar { display: flex; align-items: center; gap: 6px; padding: 3px 4px; color: var(--sel-ink); font-weight: bold;
  background: linear-gradient(90deg, var(--t1), var(--t2)); min-width: 0; }
.titlebar .ttext { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar .tfile { font-weight: normal; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appicon { width: 16px; height: 16px; flex: none; background: var(--win); border: 1px solid var(--dk); position: relative; }
.appicon::before { content: ""; position: absolute; left: 2px; right: 2px; bottom: 2px; height: 4px; background: var(--pos); box-shadow: 0 -5px 0 -1px var(--bar); }

/* Menu bar */
.menubar { display: flex; flex-wrap: wrap; padding: 1px 2px; border-bottom: 1px solid var(--sh); box-shadow: 0 1px var(--hi); }
.menu { position: relative; }
.mbtn { background: none; border: 1px solid transparent; padding: 2px 7px; cursor: default; }
.mbtn:hover { border-color: var(--hi) var(--sh) var(--sh) var(--hi); }
.mbtn[aria-expanded="true"] { border-color: var(--sh) var(--hi) var(--hi) var(--sh); }
.mbtn:focus-visible, .tbtn:focus-visible, .titem:focus-visible, .ditem:focus-visible { outline: 1px dotted var(--ink); outline-offset: -3px; }
.drop { position: absolute; z-index: 30; top: 100%; left: 0; min-width: 210px; padding: 3px; }
.ditem { display: flex; justify-content: space-between; gap: 24px; width: 100%; text-align: left; background: none; border: 0; padding: 4px 18px 4px 20px; cursor: default; white-space: nowrap; }
.ditem:hover, .ditem:focus { background: var(--sel); color: var(--sel-ink); outline: none; }
.ditem .key { opacity: .85; }
.dsep { height: 2px; margin: 3px 1px; border-top: 1px solid var(--sh); border-bottom: 1px solid var(--hi); }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 3px 4px; border-bottom: 1px solid var(--sh); box-shadow: 0 1px var(--hi); }
.tbtn { display: inline-flex; align-items: center; gap: 5px; background: none; border: 1px solid transparent; padding: 3px 7px; cursor: default; }
.tbtn:hover { border-color: var(--hi) var(--sh) var(--sh) var(--hi); }
.tbtn:active { border-color: var(--sh) var(--hi) var(--hi) var(--sh); }
.tsep { width: 2px; align-self: stretch; margin: 2px 4px; border-left: 1px solid var(--sh); border-right: 1px solid var(--hi); }
.ico { width: 16px; height: 16px; flex: none; display: inline-block; position: relative; }
.ico-new { background: var(--win); border: 1px solid var(--dk); }
.ico-new::after { content: "+"; position: absolute; inset: -3px 0 0 0; text-align: center; font-weight: bold; color: var(--pos); font-size: 13px; }
.ico-post { background: var(--tip); border: 1px solid var(--dk); }
.ico-post::after { content: ""; position: absolute; left: 3px; right: 3px; top: 3px; height: 1px; background: var(--dk); box-shadow: 0 3px var(--dk), 0 6px var(--dk); }
.ico-exp { border: 1px solid var(--dk); background: linear-gradient(var(--win) 0 0) 2px 2px / 10px 10px no-repeat, var(--pos); }
.ico-rep { border-left: 1px solid var(--dk); border-bottom: 1px solid var(--dk); }
.ico-rep::after { content: ""; position: absolute; left: 3px; bottom: 1px; width: 3px; height: 6px; background: var(--bar); box-shadow: 4px -4px 0 0 var(--neg), 8px -2px 0 0 var(--pos); }
.monthnav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.monthnav .mlabel { min-width: 128px; text-align: center; padding: 3px 8px; font-weight: bold; }

/* Buttons (dialogs, forms) */
.btn { border: 0; padding: 4px 12px; min-width: 75px; cursor: default; }
.btn:active { box-shadow: inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--sh), inset -2px -2px var(--face-2); }
.btn:focus-visible { outline: 1px dotted var(--ink); outline-offset: -5px; }
.btn.default { outline: 1px solid var(--ink); outline-offset: 0; }
.btn:disabled { color: var(--sh); text-shadow: 1px 1px var(--hi); }
.btn.sm { min-width: 0; padding: 2px 8px; }

/* Main split */
.main { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 3px; padding: 3px; min-height: 520px; }
.tree { padding: 4px 2px; overflow: auto; }
.tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul ul { margin-left: 9px; padding-left: 9px; border-left: 1px dotted var(--sh); }
.tree li { padding: 1px 0; }
.titem { display: inline-flex; align-items: center; gap: 5px; background: none; border: 0; padding: 1px 3px; cursor: default; white-space: nowrap; }
.titem[aria-current="page"] .tl { background: var(--sel); color: var(--sel-ink); }
.titem .tl { padding: 0 2px; }
.fold { width: 15px; height: 12px; flex: none; background: #e8c45a; border: 1px solid #8a6d12; position: relative; margin-top: 2px; }
.fold::before { content: ""; position: absolute; left: -1px; top: -4px; width: 7px; height: 3px; background: #e8c45a; border: 1px solid #8a6d12; border-bottom: 0; }
.doc { width: 12px; height: 14px; flex: none; background: var(--win); border: 1px solid var(--dk); position: relative; }
.doc::after { content: ""; position: absolute; left: 2px; right: 2px; top: 3px; height: 1px; background: var(--sh); box-shadow: 0 3px var(--sh), 0 6px var(--sh); }
.root-ico { width: 16px; height: 14px; flex: none; background: var(--face); border: 1px solid var(--dk); position: relative; }
.root-ico::after { content: ""; position: absolute; left: 2px; right: 2px; top: 2px; bottom: 4px; background: var(--desk); }

.content { padding: 10px 12px 14px; overflow: auto; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.vhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; border-bottom: 1px solid var(--sh); box-shadow: 0 1px var(--hi); padding-bottom: 6px; }
.vhead h1 { margin: 0; font-size: 15px; }
.vhead p { margin: 0; color: var(--mute); }
.infobar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--tip); border: 1px solid var(--ink); padding: 5px 8px; }
.infobar .i { width: 16px; height: 16px; flex: none; border-radius: 50%; background: var(--sel); color: var(--sel-ink); font: bold 11px/16px Georgia, serif; text-align: center; }
.linkbtn { background: none; border: 0; padding: 0; color: #0000cc; text-decoration: underline; cursor: pointer; }

fieldset { margin: 0; border: 1px solid var(--sh); box-shadow: inset 1px 1px var(--hi), 1px 1px var(--hi); padding: 8px 10px 10px; min-width: 0; }
legend { padding: 0 4px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.kv { width: 100%; border-collapse: collapse; }
.kv td { padding: 3px 2px; }
.kv tr.total td { border-top: 1px solid var(--sh); font-weight: bold; padding-top: 5px; }
.kv tr.sub td:first-child { padding-left: 16px; color: var(--mute); }

/* List view */
.lv { overflow: auto; max-height: 460px; padding: 2px; }
.lv table { border-collapse: collapse; width: 100%; min-width: 560px; }
.lv th { position: sticky; top: 0; z-index: 1; text-align: left; font-weight: normal; padding: 3px 6px; white-space: nowrap; cursor: default; user-select: none; }
.lv th.num { text-align: right; }
.lv td { padding: 2px 6px; white-space: nowrap; border-bottom: 1px solid #f0efeb; }
.lv td.wrap { white-space: normal; min-width: 160px; }
.lv tbody tr { cursor: default; }
.lv tbody tr.sel td { background: var(--sel); color: var(--sel-ink); }
.lv tbody tr.sel td .pos, .lv tbody tr.sel td .neg, .lv tbody tr.sel td .mute { color: var(--sel-ink); }
.lv tfoot td { border-top: 1px solid var(--sh); background: var(--face-2); font-weight: bold; position: sticky; bottom: 0; }
.lv .empty td { padding: 18px; text-align: center; color: var(--mute); white-space: normal; }
.sortmark { font-size: 9px; margin-left: 4px; }
.tag { display: inline-block; padding: 0 5px; border: 1px solid var(--sh); background: var(--face-2); font-size: 11px; }
.tag.fixed { background: #dfe6f3; } .tag.groceries { background: #e1efdc; } .tag.fuel { background: #f3e6d6; } .tag.income { background: #e6f3e6; } .tag.daily { background: #efe9f5; }
.lv tbody tr.sel .tag { color: var(--ink); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 0 5px 0 2px; }
.ticon { display: inline-block; width: 16px; height: 16px; flex: none; vertical-align: -4px; }
.ticon svg { display: block; width: 16px; height: 16px; }
.tdesc { display: inline-flex; align-items: center; gap: 5px; }
.vhead h1 { display: inline-flex; align-items: center; gap: 6px; }
.typepick { display: flex; align-items: center; gap: 6px; }
.typepick .inp { flex: 1; }
.chk { display: inline-flex; align-items: center; gap: 5px; background: none; border: 0; padding: 0; font-size: 11px; cursor: default; white-space: nowrap; }
.chk .box { width: 13px; height: 13px; flex: none; display: grid; place-items: center; background: var(--win); box-shadow: inset 1px 1px var(--sh), inset -1px -1px var(--hi), inset 2px 2px var(--dk); color: var(--pos); font: bold 11px/1 var(--ui); }
.chk.topay { color: var(--neg); } .chk.expected { color: var(--warn); } .chk.oncard, .chk:disabled { color: var(--mute); }
.chk:disabled .box { background: var(--face-2); }
.chk:focus-visible { outline: 1px dotted var(--ink); }
.lv tbody tr.sel .chk { color: var(--sel-ink); }
.warn { color: var(--warn); }
.cardhead { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 24px; margin-bottom: 10px; }

/* Desktop app (Electron) */
.wbtns { margin-left: auto; display: flex; gap: 2px; }
.wbtn { width: 18px; height: 16px; padding: 0; border: 0; font: bold 10px/14px var(--ui); color: var(--ink); }
html:not(.is-desktop) .desk-only { display: none !important; }
html.is-desktop, html.is-desktop body { height: 100%; overflow: hidden; }
html.is-desktop body { padding: 0; background: var(--face); }
.is-desktop .window { max-width: none; height: 100%; }
.is-desktop .main { flex: 1; min-height: 0; }
.is-desktop .lv { max-height: none; }
.is-desktop #app > .titlebar { -webkit-app-region: drag; user-select: none; }
.is-desktop #app > .titlebar button { -webkit-app-region: no-drag; }
.pill { display: inline-block; padding: 0 6px; border: 1px solid currentColor; font-size: 11px; white-space: nowrap; }

.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.filters label { display: inline-flex; align-items: center; gap: 5px; }
.inp, select.inp { border: 0; padding: 3px 4px; background: var(--win); box-shadow: inset 1px 1px var(--sh), inset 2px 2px var(--dk), inset -1px -1px var(--hi), inset -2px -2px var(--face-2); min-width: 0; }
.inp:focus { outline: 1px dotted var(--ink); outline-offset: 1px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }

/* Progress bars */
.pbar { height: 16px; padding: 2px 3px; min-width: 120px; }
.pbar .fill { height: 100%; background: repeating-linear-gradient(90deg, var(--bar) 0 7px, transparent 7px 9px); }
.pbar .fill.warn { background: repeating-linear-gradient(90deg, var(--warn) 0 7px, transparent 7px 9px); }
.pbar .fill.over { background: repeating-linear-gradient(90deg, var(--neg) 0 7px, transparent 7px 9px); }

/* Horizontal bars */
.hbars { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 8px; align-items: center; }
.hb { height: 12px; background: var(--bar); border: 1px solid var(--dk); }

/* Column chart */
.chart { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 6px; }
.yax { position: relative; height: 150px; width: 60px; font-size: 11px; color: var(--mute); }
.yax span { position: absolute; right: 0; transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.plot { position: relative; height: 150px; border-left: 1px solid var(--dk); border-bottom: 1px solid var(--dk); background: var(--win); display: flex; align-items: flex-end; justify-content: space-around; padding: 0 4px; }
.plot .gl { position: absolute; left: 0; right: 0; border-top: 1px dotted #c0c0c0; }
.grp { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 100%; }
.cb { width: 16px; border: 1px solid var(--dk); border-bottom: 0; }
.cb.inc { background: var(--pos); } .cb.exp { background: var(--neg); }
.grp.cur .cb { outline: 1px dotted var(--ink); outline-offset: 1px; }
.xl { display: flex; justify-content: space-around; padding: 3px 4px 0; font-size: 11px; grid-column: 2; }
.xl span { width: 34px; text-align: center; }
.xl span.cur { font-weight: bold; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; font-size: 11px; }
.legend i { display: inline-block; width: 10px; height: 10px; border: 1px solid var(--dk); margin-right: 4px; vertical-align: -1px; }

/* Status bar */
.statusbar { display: flex; flex-wrap: wrap; gap: 2px; padding: 2px; }
.pane { padding: 2px 6px; box-shadow: inset 1px 1px var(--sh), inset -1px -1px var(--hi); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pane.grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* Dialogs */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.08); }
.dialog { width: min(440px, 100%); max-height: calc(100vh - 32px); overflow: auto; }
.dialog .titlebar { justify-content: space-between; }
.dx { width: 16px; height: 14px; padding: 0; border: 0; font: bold 10px/12px var(--ui); }
.dbody { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.form { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 10px; align-items: center; }
.form .row { display: contents; }
.form .inp { width: 100%; }
.form .hint { grid-column: 2; color: var(--mute); font-size: 11px; margin-top: -3px; }
.dfoot { display: flex; justify-content: flex-end; gap: 6px; padding: 0 12px 12px; }
.err { color: var(--neg); min-height: 1em; }
.msg { display: flex; gap: 12px; align-items: flex-start; }
.msg .big { width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--sel); color: var(--sel-ink); font: bold 20px/32px Georgia, serif; text-align: center; }
.msg .big.warn { border-radius: 0; background: none; color: var(--ink); width: 0; height: 0; border-left: 17px solid transparent; border-right: 17px solid transparent; border-bottom: 30px solid #f2cf2a; position: relative; }
.msg .big.warn::after { content: "!"; position: absolute; left: -3px; top: 9px; font: bold 16px/1 var(--ui); color: var(--ink); }
textarea.inp { width: 100%; height: 200px; font: 11px/1.4 var(--mono); resize: vertical; }

@media (max-width: 760px) {
  body { padding-block: 8px; }
  .main { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .tree { max-height: 150px; }
  .monthnav { margin-left: 0; width: 100%; justify-content: space-between; }
  .content { padding: 8px; }
  .tbtn .tx { display: none; }
  .tbtn .tx.keep { display: inline; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(() => {

const fmtEUR = new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR' });

  bank: svg('<path d="M1 6 8 2l7 4z" fill="#d4d0c8" stroke="#404040"/><rect x="2.5" y="7" width="2" height="5" fill="#808080"/><rect x="7" y="7" width="2" height="5" fill="#808080"/><rect x="11.5" y="7" width="2" height="5" fill="#808080"/><rect x="1" y="12.5" width="14" height="2" fill="#404040"/>')
};
const ico = k => ICONS[k] ? `<span class="ticon" aria-hidden="true">${ICONS[k]}</span>` : '';

const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const ymOf = s => s.slice(0, 7);
const addM = (m, k) => { let [y, mo] = m.split('-').map(Number); mo += k; while (mo > 12) { mo -= 12; y++; } while (mo < 1) { mo += 12; y--; } return `${y}-${pad(mo)}`; };
const mLabel = m => MONTHS[Number(m.slice(5)) - 1] + ' ' + m.slice(0, 4);
const mShort = m => MONTHS[Number(m.slice(5)) - 1].slice(0, 3);
const dim = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
const dFmt = s => `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}`;

let S = null;
const ui = { view: 'overview', month: ymOf(todayStr()), sel: null, filter: { type: '', cat: '', q: '', all: false, status: '', method: '' }, sort: { key: 'date', dir: -1 }, lock: '' };

/* ---------- Sample data ---------- */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const METHOD_KINDS = { cash: 'Cash', bank: 'Bank account', debit: 'Debit card', credit: 'Credit card' };
function defaultAccounts(sample) {
  const a = [{ id: 'cash', name: 'Cash', kind: 'cash' }, { id: 'bank', name: sample ? 'Joint current account' : 'Bank account', kind: 'bank' }, { id: 'debit', name: 'Debit card', kind: 'debit', last4: sample ? '1187' : '' }];
  if (sample) a.push({ id: 'visa', name: 'Visa', kind: 'credit', last4: '4821', limit: 2500, closingDay: 25, dueDay: 15 }, { id: 'mc', name: 'Mastercard', kind: 'credit', last4: '9034', limit: 1500, closingDay: 5, dueDay: 28 });
  return a;
}
// Brings ledgers saved by older versions up to date.
function migrate(d) {
  d.fixed ||= []; d.members ||= ['Me']; d.accounts ||= defaultAccounts(false); d.cardPayments ||= [];
  for (const t of d.tx) if (t.cleared === undefined) t.cleared = true;
  d.ver = 2; return d;
}
function sampleLedger() {
  const rnd = mulberry32(1113), R = (a, b) => a + (b - a) * rnd(), pick = a => a[Math.floor(rnd() * a.length)];
  const categories = [
    ['housing','Housing','expense',900],['utilities','Utilities','expense',230],['groceries','Groceries','expense',480],
    ['transport','Transport','expense',230],['dining','Dining out','expense',140],['health','Health','expense',60],
    ['leisure','Leisure','expense',120],['subs','Subscriptions','expense',45],['insurance','Insurance','expense',60],
    ['other','Other','expense',0],['salary','Salary','income',0],['otherinc','Other income','income',0]
  ].map(([id, name, kind, budget]) => ({ id, name, kind, budget }));
  const fixed = [
    ['Rent', 850, 'housing', 1, 'Alex', 'bank'], ['Gym membership', 35, 'leisure', 3, 'Alex', 'visa'], ['Home internet', 29.9, 'utilities', 5, JOINT, 'bank'],
    ['Mobile plans', 19.98, 'subs', 8, 'Alex', 'visa'], ['Electricity', 74.6, 'utilities', 12, 'Sam', 'bank'], ['Gas & heating', 96, 'utilities', 15, 'Sam', 'bank'],
    ['Streaming', 13.99, 'subs', 18, 'Sam', 'mc'], ['Car insurance', 54.2, 'insurance', 20, 'Sam', 'bank']
  ].map(([name, amount, cat, day, paidBy, method]) => ({ id: uid(), name, amount, cat, day, paidBy, method, active: true }));
  const daily = [['Coffee & croissant','dining',2.4,4.8],['Lunch out','dining',9,16],['Pizza night','dining',22,38],['Pharmacy','health',6,28],
    ['Cinema tickets','leisure',15,22],['Bookshop','leisure',9,28],['Parking','transport',1.5,6],['Hardware store','other',8,40],['Train ticket','transport',4.6,12.5],['Haircut','other',18,28]];
  const today = todayStr(), cur = ymOf(today), tx = [];
  let odo = 48210;
  const add = t => { const { expected, ...rest } = t; if (t.date <= today || expected) tx.push({ id: uid(), note: '', cleared: !expected, ...rest }); };
  for (let k = 5; k >= 0; k--) {
    const m = addM(cur, -k), D = d => `${m}-${pad(Math.min(d, dim(m)))}`;
    for (const f of fixed) add({ date: D(f.day), type: 'fixed', desc: f.name, amount: f.name === 'Electricity' || f.name === 'Gas & heating' ? r2(f.amount * R(.8, 1.25)) : f.amount, cat: f.cat, paidBy: f.paidBy, method: f.method, fixedId: f.id });
    add({ date: D(27), type: 'income', desc: 'Salary', amount: 2450, cat: 'salary', paidBy: 'Alex', method: 'bank', expected: k === 0 });
    add({ date: D(10), type: 'income', desc: 'Salary', amount: 1820, cat: 'salary', paidBy: 'Sam', method: 'bank' });
    for (const d of [2, 6, 9, 13, 17, 20, 24, 28]) {
      if (rnd() < .2) continue;
      const amt = r2(R(16, 98));
      add({ date: D(d), type: 'groceries', desc: amt > 55 ? 'Weekly shop' : 'Top-up shop', amount: amt, cat: 'groceries', paidBy: pick(['Alex', 'Sam', JOINT]), store: pick(['Lidl', 'Coop', 'Farmers market', 'Corner shop', 'Coop']), method: pick(['debit', 'debit', 'visa', 'cash']) });
    }
    for (const d of [4, 15, 26]) {
      const l = r2(R(32, 44)), p = R(1.74, 1.86); odo += Math.round(R(520, 690));
      add({ date: D(d), type: 'fuel', desc: 'Full tank', amount: r2(l * p), cat: 'transport', paidBy: pick(['Alex', 'Sam']), liters: l, odometer: odo, method: pick(['visa', 'mc']) });
    }
    for (let i = 0; i < 11; i++) {
      const [desc, cat, a, b] = pick(daily);
      add({ date: D(1 + Math.floor(rnd() * dim(m))), type: 'daily', desc, amount: r2(R(a, b)), cat, paidBy: pick(['Alex', 'Sam']), method: pick(['cash', 'cash', 'debit', 'visa', 'mc']) });
    }
  }

  const d0 = new Date(); d0.setDate(d0.getDate() - 3);
  const recent = `${d0.getFullYear()}-${pad(d0.getMonth() + 1)}-${pad(d0.getDate())}`;
  for (const t of tx) if (t.type === 'fixed' && t.date > recent && t.method === 'bank') t.cleared = false;
  const accounts = defaultAccounts(true);
  const L = { ver: 2, sample: true, members: ['Alex', 'Sam'], categories, fixed, tx, accounts, cardPayments: [] };
  for (const card of accounts.filter(a => a.kind === 'credit'))
    for (const st of cardStatements(card, L)) if (st.due < today) settleStatement(L, card, st, st.due, 'bank');
  return L;
}
function emptyLedger() {
  const s = sampleLedger();
  return { ver: 2, sample: false, members: ['Me'], categories: s.categories.map(c => ({ ...c })), fixed: [], tx: [], accounts: defaultAccounts(false), cardPayments: [] };
}

/* ---------- Storage ---------- */
let savedAt = null;
function load() {
  try { const raw = DESK ? DESK.load() : localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.tx) && Array.isArray(d.categories)) return migrate(d); } } catch (e) {}
  return sampleLedger();
}
function save() {
  if (DESK) {
    savedAt = new Date();
    DESK.save(JSON.stringify(S)).catch(err => { savedAt = null; status('Could not save the ledger file: ' + (err?.message || err)); });
    return;
  }
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); savedAt = new Date(); }
  catch (e) { savedAt = null; status('Could not save: this browser is blocking storage. Use File > Back up ledger to keep a copy.'); }
}
function commit(msg) { save(); render(); if (msg) status(msg); }

/* ---------- Lookups ---------- */
const cat = id => S.categories.find(c => c.id === id);
const catName = id => cat(id)?.name ?? '(none)';
const isInc = t => t.type === 'income';
const inMonth = (t, m) => ymOf(t.date) === m;
const acct = id => S.accounts.find(a => a.id === id);
const isCard = t => acct(t.method)?.kind === 'credit';
const acctIco = a => ico(a.kind === 'credit' ? 'card' : a.kind);
const methodLabel = id => { const a = acct(id); return a ? `<span class="tdesc">${acctIco(a)}<span>${esc(a.name)}${a.last4 ? ' ••' + esc(a.last4) : ''}</span></span>` : '<span class="mute">–</span>'; };
const methodOpts = sel => '<option value="">(not set)</option>' + S.accounts.map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.name)}${a.last4 ? ' ••' + esc(a.last4) : ''}</option>`).join('');
// Credit card statements: a charge belongs to the statement that closes on the next closing day.
function stmtClose(card, ds) {
  const m = ymOf(ds), c = Math.min(card.closingDay, dim(m));
  if (Number(ds.slice(8)) <= c) return `${m}-${pad(c)}`;
  const n = addM(m, 1); return `${n}-${pad(Math.min(card.closingDay, dim(n)))}`;
}
function stmtDue(card, close) { const m = ymOf(close), dm = card.dueDay > card.closingDay ? m : addM(m, 1); return `${dm}-${pad(Math.min(card.dueDay, dim(dm)))}`; }
function cardStatements(card, L = S) {
  const map = {}, today = todayStr();
  for (const t of L.tx) {
    if (t.method !== card.id || t.type === 'income') continue;
    const c = stmtClose(card, t.date);
    const st = (map[c] ||= { close: c, due: stmtDue(card, c), tx: [], total: 0, open: 0 });
    st.tx.push(t); st.total += t.amount; if (!t.settled) st.open += t.amount;
  }
  return Object.values(map).sort((a, b) => b.close.localeCompare(a.close)).map(st => {
    st.state = st.open < 0.005 ? 'paid' : st.close >= today ? 'open' : st.due < today ? 'overdue' : 'due'; return st;
  });
}
function settleStatement(L, card, st, date, from) {
  const id = uid(), amount = r2(st.tx.filter(t => !t.settled).reduce((a, t) => a + t.amount, 0));
  for (const t of st.tx) if (!t.settled) t.settled = id;
  L.cardPayments.push({ id, card: card.id, close: st.close, date, amount, from });
}
const STATE = { received: ['Received', 'pos'], expected: ['Expected', 'warn'], paid: ['Paid', 'pos'], topay: ['To pay', 'neg'], oncard: ['On card', 'mute'] };
function txState(t) {
  if (isInc(t)) return t.cleared ? 'received' : 'expected';
  if (isCard(t)) return t.settled ? 'paid' : 'oncard';
  return t.cleared ? 'paid' : 'topay';
}
function statusCell(t) {
  const s = txState(t), card = isCard(t) && !isInc(t), done = s === 'paid' || s === 'received';
  const late = (s === 'topay' || s === 'expected') && t.date < todayStr();
  const tip = card ? 'Settled when the card statement is paid' : done ? `Mark as not ${isInc(t) ? 'received' : 'paid'}` : `Mark as ${isInc(t) ? 'received' : 'paid'} (Space)`;
  return `<button class="chk ${s}" data-act="toggle-clear" data-id="${t.id}" title="${tip}" aria-pressed="${done}" ${card ? 'disabled' : ''}><span class="box">${done ? '✓' : ''}</span>${STATE[s][0]}${late ? ' (late)' : ''}</button>`;
}
function openItems() {
  const today = todayStr(), items = [];
  for (const t of S.tx) { const s = txState(t); if (s === 'topay' || s === 'expected') items.push({ kind: 'tx', t, s, date: t.date, amount: t.amount, overdue: t.date < today }); }
  for (const card of S.accounts.filter(a => a.kind === 'credit'))
    for (const st of cardStatements(card)) if (st.state === 'due' || st.state === 'overdue') items.push({ kind: 'stmt', card, st, s: 'stmt', date: st.due, amount: st.open, overdue: st.state === 'overdue' });
  return items.sort((a, b) => a.date.localeCompare(b.date));
}
function monthStats(m) {
  const tx = S.tx.filter(t => inMonth(t, m));
  let inc = 0, exp = 0; const byType = { fixed: 0, daily: 0, groceries: 0, fuel: 0 }, byCat = {}, fixedByCat = {};
  for (const t of tx) {
    if (isInc(t)) inc += t.amount;
    else {
      exp += t.amount; byType[t.type] = (byType[t.type] || 0) + t.amount; byCat[t.cat] = (byCat[t.cat] || 0) + t.amount;
      if (t.type === 'fixed') fixedByCat[t.cat] = (fixedByCat[t.cat] || 0) + t.amount;
    }
  }
  return { tx, inc, exp, byType, byCat, fixedByCat, bal: inc - exp };
}
function niceMax(v) {
  if (v <= 0) return 100;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const s of [1, 2, 2.5, 5, 10]) if (s * p >= v) return s * p;
  return 10 * p;
}
function fixedStatus(f, m) {
  if (S.tx.some(t => t.fixedId === f.id && inMonth(t, m))) return 'posted';
  if (!f.active) return 'paused';
  const today = todayStr(), cm = ymOf(today);
  if (m > cm) return 'scheduled';
  if (m === cm && Math.min(f.day, dim(m)) > Number(today.slice(8))) return 'scheduled';
  return 'due';
}

/* ---------- Rendering ---------- */
const TREE = [
  { v: 'overview', l: 'Overview' }, { v: 'register', l: 'Register' },
  { l: 'Expenses', kids: [{ v: 'fixed', l: 'Fixed expenses', i: 'fixed' }, { v: 'daily', l: 'Daily spending', i: 'daily' }, { v: 'groceries', l: 'Groceries', i: 'groceries' }, { v: 'fuel', l: 'Fuel log', i: 'fuel' }] },
  { v: 'cards', l: 'Cards & accounts', i: 'card' }, { v: 'reports', l: 'Reports' },
  { l: 'Setup', kids: [{ v: 'categories', l: 'Categories & budgets' }, { v: 'household', l: 'Household' }] }

function renderTree() {

    ? `<li><span class="titem"><span class="fold" aria-hidden="true"></span><span class="tl">${esc(n.l)}</span></span><ul>${n.kids.map(item).join('')}</ul></li>`

  $('#tree').innerHTML = `<ul><li><span class="titem"><span class="root-ico" aria-hidden="true"></span><span class="tl"><b>${S.sample ? 'Sample ledger' : 'My ledger'}</b></span></span><ul>${TREE.map(item).join('')}</ul></li></ul>`;
}
function head(title, sub, icon) { return `<div class="vhead"><h1>${icon ? ico(icon) : ''}${esc(title)}</h1><p>${sub}</p></div>`; }
function sampleBar() {
  return S.sample ? `<div class="infobar"><span class="i" aria-hidden="true">i</span><span>You are looking at <b>sample data</b> for a two-person household (Alex and Sam). Explore freely, then start fresh.</span><button class="linkbtn" data-act="new-ledger">Start an empty ledger</button></div>` : '';
}

const VIEWS = {
  overview() {
    const m = ui.month, st = monthStats(m), prev = monthStats(addM(m, -1));
    const fixedTot = st.byType.fixed, varTot = st.exp - fixedTot;
    const rate = st.inc > 0 ? (st.bal / st.inc) * 100 : 0;
    const diff = st.exp - prev.exp;
    const typeMax = Math.max(1, ...EXP_TYPES.map(k => st.byType[k]));
    const isCur = m === ymOf(todayStr()), dayFrac = isCur ? Number(todayStr().slice(8)) / dim(m) : 1;
    const budgets = S.categories.filter(c => c.kind === 'expense' && (c.budget > 0 || st.byCat[c.id]));
    const brow = c => {
      const sp = st.byCat[c.id] || 0, b = c.budget || 0, pct = b ? sp / b : 0;
      // Pace only applies to the variable part: bills paid on day 1 are not "spending too fast".
      const fx = st.fixedByCat[c.id] || 0, varB = b - fx, varPct = varB > 0 ? (sp - fx) / varB : 0;
      let pill = '<span class="mute">No budget</span>', cls = '';
      if (b) {
        if (sp > b) { cls = 'over'; pill = `<span class="pill neg">Over by ${money(sp - b)}</span>`; }
        else if (isCur && varB > 0 && varPct > dayFrac + 0.1) { cls = 'warn'; pill = `<span class="pill" style="color:var(--warn)">Ahead of pace</span>`; }
        else if (pct >= .9) { cls = 'warn'; pill = `<span class="pill" style="color:var(--warn)">Near limit</span>`; }
        else pill = `<span class="pill pos">On track</span>`;

    const shared = exp.filter(t => mem.includes(t.paidBy)), joint = exp.filter(t => t.paidBy === JOINT).reduce((a, t) => a + t.amount, 0);

    const deb = bal.filter(x => x.b < -0.005).map(x => ({ ...x })), cre = bal.filter(x => x.b > 0.005).map(x => ({ ...x })), moves = [];
    while (deb.length && cre.length) { const d = deb[0], c = cre[0], amt = Math.min(-d.b, c.b); moves.push([d.p, c.p, amt]); d.b += amt; c.b -= amt; if (d.b > -0.005) deb.shift(); if (c.b < 0.005) cre.shift(); }
    return head('Household', 'Everyone logs what they paid. Clarity splits shared costs equally and tells you who owes whom.') + `
      <div class="cols">
        <fieldset><legend>Members</legend>
          <div class="lv sunken" style="max-height:none"><table style="min-width:0"><tbody>${mem.map((p, i) => `<tr><td><input class="inp" id="mem-${i}" data-mem="${i}" value="${esc(p)}" aria-label="Member name"></td><td style="width:1%"><button class="btn sm raised" data-act="del-mem" data-id="${i}" ${mem.length < 2 ? 'disabled' : ''}>Remove</button></td></tr>`).join('')}</tbody></table></div>
          <form class="filters" id="addmem" style="margin-top:8px"><input class="inp" id="nm-name" placeholder="Name" required maxlength="30" aria-label="New member name"><button class="btn raised">Add member</button></form>
          <p class="mute" style="margin:8px 0 0">No passwords or admin rights: each person picks their name in the Paid by field. Use “${JOINT}” for money from a shared account; it is left out of the split.</p>
        </fieldset>
        <fieldset><legend>Settle up for ${mLabel(m)}</legend>
          <table class="kv"><tr><td>Shared spending paid personally</td><td class="num">${money(total)}</td></tr><tr><td>Fair share each (${mem.length} ${mem.length === 1 ? 'person' : 'people'})</td><td class="num">${money(share)}</td></tr>
          ${bal.map(x => `<tr class="sub"><td>${esc(x.p)} paid</td><td class="num">${money(x.paid)} <span class="${x.b < 0 ? 'neg' : 'pos'}">(${x.b >= 0 ? '+' : ''}${money(x.b)})</span></td></tr>`).join('')}
          <tr><td>Paid from ${JOINT.toLowerCase()}</td><td class="num">${money(joint)}</td></tr></table>
          <div class="infobar" style="margin-top:10px"><span class="i" aria-hidden="true">i</span><span>${moves.length ? moves.map(([a, b, v]) => `<b>${esc(a)}</b> pays <b>${esc(b)}</b> ${money(v)}`).join('<br>') : 'Everyone is even this month.'}</span></div>
        </fieldset>

  }
};

  const m = ui.month, due = S.fixed.filter(f => fixedStatus(f, m) === 'due');
  if (!due.length) { msgBox('Post fixed expenses', `Nothing is due for ${mLabel(m)}. Items already posted, paused, or scheduled for later this month are skipped.`); return; }
  for (const f of due) S.tx.push({ id: uid(), date: `${m}-${pad(Math.min(f.day, dim(m)))}`, type: 'fixed', desc: f.name, amount: f.amount, cat: f.cat, paidBy: f.paidBy, method: f.method || '', cleared: false, fixedId: f.id, note: '' });
  commit(`Posted ${due.length} fixed expense${due.length > 1 ? 's' : ''} (${money(due.reduce((a, f) => a + f.amount, 0))}) to ${mLabel(m)}`);
}

function selected() {
  if (!ui.sel) return null;
  return ui.sel.kind === 'tx' ? S.tx.find(t => t.id === ui.sel.id) : S.fixed.find(f => f.id === ui.sel.id);
}
function editSel() {
  const s = selected();
  if (!s) return status('Select a row first, then choose Edit.');
  ui.sel.kind === 'tx' ? entryDialog(s) : fixedDialog(s);
}
function deleteSel() {
  const s = selected();
  if (!s) return status('Select a row first, then choose Delete.');
  const isTx = ui.sel.kind === 'tx';
  msgBox('Confirm delete', isTx ? `Delete <b>${esc(s.desc)}</b> of ${money(s.amount)} on ${dFmt(s.date)}?` : `Delete the fixed expense <b>${esc(s.name)}</b>? Entries already posted stay in the register.`,
    { ok: 'Delete', cancel: 'Cancel', warn: true, onOk() { if (isTx) S.tx = S.tx.filter(t => t.id !== s.id); else S.fixed = S.fixed.filter(f => f.id !== s.id); ui.sel = null; commit('Deleted'); } });
}

function csv() {
  const q = v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = S.tx.slice().sort((a, b) => a.date.localeCompare(b.date)).map(t => [t.date, TYPES[t.type], catName(t.cat), t.desc, (isInc(t) ? '' : '-') + t.amount.toFixed(2), t.paidBy, acct(t.method)?.name, STATE[txState(t)][0], t.store, t.liters, t.odometer, t.note].map(q).join(','));
  return ['Date,Type,Category,Description,Amount,Paid by,Paid with,Status,Store,Litres,Odometer,Note', ...rows].join('\n');
}
function textDialog(title, intro, text, fileName) {
  const saveBtn = DESK ? `<button class="btn raised" type="button" data-act="save-text" data-name="${esc(fileName)}">Save as file…</button>` : '';
  dialog(title, `<p style="margin:0">${intro}</p><textarea class="inp" id="dlg-text" readonly>${esc(text)}</textarea><div class="btnrow">${saveBtn}<button class="btn raised" type="button" data-act="copy-text">Copy to clipboard</button></div>`, { ok: 'Close', cancel: null, wide: true });
}

const actions = {
  'go': el => { ui.view = el.dataset.view; ui.sel = null; ui.filter = { type: '', cat: '', q: '', all: false, status: '', method: '' }; render(); $('#content').scrollTop = 0; },
  'new-entry': el => entryDialog(null, el?.dataset?.type || (ui.view === 'fuel' ? 'fuel' : ui.lock || undefined)),
  'new-fixed': () => fixedDialog(null),
  'edit-sel': editSel, 'delete-sel': deleteSel, 'post-fixed': postFixed,
  'prev-month': () => { ui.month = addM(ui.month, -1); render(); },
  'next-month': () => { ui.month = addM(ui.month, 1); render(); },
  'this-month': () => { ui.month = ymOf(todayStr()); render(); },
  'export-csv': () => textDialog('Export to CSV', `${S.tx.length} entries. Save them as a .csv file or paste them into a spreadsheet.`, csv(), `clarity-${todayStr()}.csv`),
  'backup': () => textDialog('Back up ledger', 'Your whole ledger as text. Keep a copy somewhere safe; File › Restore brings it back.', JSON.stringify(S, null, 1), `clarity-backup-${todayStr()}.json`),
  'save-text': el => DESK.saveFile(el.dataset.name, $('#dlg-text').value).then(p => { if (p) status('Saved to ' + p); }).catch(err => status('Could not save the file: ' + (err?.message || err))),
  'open-backup': () => DESK.openFile().then(t => { if (t != null) $('#rs-text').value = t; }).catch(err => dlgErr('Could not open the file: ' + (err?.message || err))),
  'win-min': () => DESK?.win('minimize'), 'win-max': () => DESK?.win('maximize'), 'win-close': () => DESK?.win('close'),
  'restore': () => dialog('Restore from backup', `<p style="margin:0">${DESK ? 'Open a backup file, or paste' : 'Paste'} a backup made with File › Back up ledger. It replaces everything currently in Clarity.</p>${DESK ? '<div class="btnrow"><button class="btn raised" type="button" data-act="open-backup">Open backup file…</button></div>' : ''}<textarea class="inp" id="rs-text" placeholder="Paste backup here"></textarea>`, {
    ok: 'Restore', wide: true, onSubmit() {
      try { const d = JSON.parse($('#rs-text').value); if (!d || !Array.isArray(d.tx) || !Array.isArray(d.categories) || !Array.isArray(d.members)) throw 0;
        S = migrate({ fixed: [], ...d }); ui.sel = null; commit(`Restored ${S.tx.length} entries`); return true; }
      catch (e) { return dlgErr('That text is not a Clarity backup. Copy the whole backup, including the first { and last }.'); }
    } }),
  'load-sample': () => msgBox('Load sample data', 'Replace your ledger with the sample household? Your current entries will be lost unless you back them up first.', { ok: 'Load sample', cancel: 'Cancel', warn: true, onOk() { S = sampleLedger(); ui.sel = null; commit('Sample data loaded'); } }),
  'new-ledger': () => msgBox('New empty ledger', 'Start an empty ledger? All entries and fixed expenses are cleared. Categories and budgets are kept as a starting point.', { ok: 'Start empty', cancel: 'Cancel', warn: true, onOk() { S = emptyLedger(); ui.sel = null; ui.view = 'household'; commit('Empty ledger ready. Add your household members first.'); } }),
  'about': () => msgBox('About Clarity', `<b>Clarity ${esc(DESK?.version || '1.0')}</b><br>Household accounts, the straightforward way.<br><br>${DESK
    ? `Your ledger is saved in:<br><code style="word-break:break-all">${esc(DESK.dataPath)}</code><br>A daily backup copy is kept in the <i>backups</i> folder next to it.`
    : 'Your ledger is stored in this browser only. Use File › Back up ledger to keep a copy.'}`),
  'shortcuts': () => msgBox('Keyboard shortcuts', `<table class="kv"><tr><td>Ins</td><td>New entry</td></tr><tr><td>Enter</td><td>Edit selected row</td></tr><tr><td>Del</td><td>Delete selected row</td></tr><tr><td>Space</td><td>Mark selected entry paid / received</td></tr><tr><td>↑ / ↓</td><td>Move selection</td></tr><tr><td>PgUp / PgDn</td><td>Previous / next month</td></tr><tr><td>F9</td><td>Post due fixed expenses</td></tr><tr><td>Alt+F, E, V, T, H</td><td>Open menus</td></tr><tr><td>F1</td><td>About</td></tr></table>`),
  'dlg-close': closeDialog,
  'toggle-clear': el => {
    const t = S.tx.find(x => x.id === el.dataset.id); if (!t) return;
    if (isCard(t) && !isInc(t)) return status('Card charges are marked paid when you pay the card statement (Cards & accounts).');
    t.cleared = !t.cleared; ui.sel = { kind: 'tx', id: t.id }; commit(`${t.desc}: ${STATE[txState(t)][0].toLowerCase()}`);
  },
  'pay-stmt': el => payStmtDialog(el.dataset.card, el.dataset.close),
  'undo-stmt': el => {
    const p = S.cardPayments.find(x => x.id === el.dataset.id); if (!p) return;
    msgBox('Undo card payment', `Undo the payment of ${money(p.amount)} made on ${dFmt(p.date)}? The charges go back to unpaid.`, { ok: 'Undo payment', cancel: 'Cancel', warn: true,
      onOk() { S.tx.forEach(t => { if (t.settled === p.id) delete t.settled; }); S.cardPayments = S.cardPayments.filter(x => x.id !== p.id); commit('Card payment undone'); } });
  },
  'new-acct': () => acctDialog(null),
  'edit-acct': el => acctDialog(acct(el.dataset.id)),
  'del-acct': el => {
    const a = acct(el.dataset.id), n = S.tx.filter(t => t.method === a.id).length + S.fixed.filter(f => f.method === a.id).length;
    if (n) return msgBox('Payment method in use', `<b>${esc(a.name)}</b> is used by ${n} entries. Rename it instead, or change those entries first.`);
    S.accounts = S.accounts.filter(x => x.id !== a.id); commit(`Deleted ${a.name}`);
  },
  'copy-text': () => { const ta = $('#dlg-text'); navigator.clipboard?.writeText(ta.value).then(() => status('Copied to clipboard')).catch(() => { ta.select(); status('Text selected. Press Ctrl+C to copy.'); }) ?? (ta.select(), status('Text selected. Press Ctrl+C to copy.')); },
  'del-cat': el => {
    const id = el.dataset.id, c = cat(id), n = S.tx.filter(t => t.cat === id).length + S.fixed.filter(f => f.cat === id).length;
    if (n) return msgBox('Category in use', `<b>${esc(c.name)}</b> is used by ${n} entries. Move them to another category first, or rename this one instead.`);
    S.categories = S.categories.filter(x => x.id !== id); commit(`Deleted category ${c.name}`);
  },
  'del-mem': el => { const i = +el.dataset.id, name = S.members[i]; S.members.splice(i, 1); commit(`Removed ${name}. Their past entries keep the name.`); }
};

/* ---------- Menus ---------- */
let openMenu = null;
function setMenu(name) {
  document.querySelectorAll('.mbtn').forEach(b => { const on = b.dataset.menu === name; b.setAttribute('aria-expanded', on); $('#m-' + b.dataset.menu).hidden = !on; });
  openMenu = name;
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const mb = e.target.closest('.mbtn');
  if (mb) { setMenu(openMenu === mb.dataset.menu ? null : mb.dataset.menu); return; }
  if (openMenu && !e.target.closest('.drop')) setMenu(null);
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled) { if (openMenu) setMenu(null); e.preventDefault(); actions[a.dataset.act]?.(a); return; }
  const th = e.target.closest('th[data-sort]');
  if (th) { const k = th.dataset.sort; ui.sort = { key: k, dir: ui.sort.key === k ? -ui.sort.dir : (k === 'date' || k === 'amount' ? -1 : 1) }; regList(); return; }
  const tr = e.target.closest('tr[data-id]');
  if (tr) { ui.sel = { kind: tr.dataset.kind, id: tr.dataset.id }; tr.closest('tbody').querySelectorAll('tr.sel').forEach(r => r.classList.remove('sel')); tr.classList.add('sel'); }
});
document.addEventListener('mouseover', e => { const mb = e.target.closest('.mbtn'); if (openMenu && mb && mb.dataset.menu !== openMenu) setMenu(mb.dataset.menu); });
document.addEventListener('dblclick', e => { if (DESK && e.target.closest('#app > .titlebar') && !e.target.closest('button')) { DESK.win('maximize'); return; } const tr = e.target.closest('tr[data-id]'); if (tr) { ui.sel = { kind: tr.dataset.kind, id: tr.dataset.id }; editSel(); } });
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'dlg-form') { if (dlgSubmit && dlgSubmit() !== false) closeDialog(); return; }
  if (e.target.id === 'addcat') {
    const name = $('#nc-name').value.trim(); if (!name) return;
    S.categories.push({ id: uid(), name, kind: $('#nc-kind').value, budget: parseFloat($('#nc-budget').value) || 0 }); commit(`Added category ${name}`);
  }
  if (e.target.id === 'addmem') {
    const name = $('#nm-name').value.trim(); if (!name) return;
    if (S.members.includes(name) || name === JOINT) return status(`${name} is already a member.`);
    S.members.push(name); commit(`Added ${name} to the household`);
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'flt-q') { ui.filter.q = e.target.value; regList(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'flt-type') { ui.filter.type = t.value; regList(); }
  else if (t.id === 'flt-cat') { ui.filter.cat = t.value; regList(); }
  else if (t.id === 'flt-all') { ui.filter.all = t.checked; regList(); }
  else if (t.id === 'flt-status') { ui.filter.status = t.value; regList(); }
  else if (t.id === 'flt-method') { ui.filter.method = t.value; regList(); }
  else if (t.dataset.cat) {
    const c = cat(t.dataset.cat); if (!c) return;
    if (t.dataset.field === 'name') { const v = t.value.trim(); if (!v) { t.value = c.name; return; } c.name = v; }
    else c.budget = Math.max(0, parseFloat(t.value) || 0);
    commit(`Saved ${c.name}`);
  } else if (t.dataset.mem !== undefined) {
    const i = +t.dataset.mem, old = S.members[i], v = t.value.trim();
    if (!v || v === JOINT || (S.members.includes(v) && v !== old)) { t.value = old; return status('Pick a different name.'); }
    S.members[i] = v; S.tx.forEach(x => { if (x.paidBy === old) x.paidBy = v; }); S.fixed.forEach(x => { if (x.paidBy === old) x.paidBy = v; });
    commit(`Renamed ${old} to ${v}`);
  }
});
document.addEventListener('keydown', e => {
  const dlg = !$('#overlay').hidden, typing = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
  if (e.key === 'Escape') { if (dlg) closeDialog(); else if (openMenu) setMenu(null); return; }
  if (dlg) {
    if (e.key === 'Tab') { const f = [...$('#dialog').querySelectorAll('button, input, select, textarea')].filter(x => !x.disabled && x.offsetParent); if (!f.length) return;
      const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } }
    return;
  }
  if (e.altKey && !e.ctrlKey) { const m = { f: 'file', e: 'edit', v: 'view', t: 'tools', h: 'help' }[e.key.toLowerCase()]; if (m) { e.preventDefault(); setMenu(m); $('#m-' + m + ' .ditem')?.focus(); return; } }
  if (openMenu && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); const it = [...$('#m-' + openMenu).querySelectorAll('.ditem')], i = it.indexOf(document.activeElement); it[(i + (e.key === 'ArrowDown' ? 1 : -1) + it.length) % it.length].focus(); return; }
  if (e.key === 'F1') { e.preventDefault(); actions.about(); return; }
  if (e.key === 'F9') { e.preventDefault(); postFixed(); return; }
  if (typing) return;
  if (e.key === 'Insert') { e.preventDefault(); actions['new-entry'](); }
  else if (e.key === 'Delete') { e.preventDefault(); deleteSel(); }
  else if (e.key === 'Enter' && ui.sel && e.target.tagName !== 'BUTTON') { e.preventDefault(); editSel(); }
  else if (e.key === ' ' && ui.sel?.kind === 'tx' && e.target.tagName !== 'BUTTON') { e.preventDefault(); actions['toggle-clear']({ dataset: { id: ui.sel.id } }); }
  else if (e.key === 'PageUp') { e.preventDefault(); actions['prev-month'](); }
  else if (e.key === 'PageDown') { e.preventDefault(); actions['next-month'](); }
  else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && ui.sel) {
    const rows = [...$('#content').querySelectorAll('tr[data-id]')], i = rows.findIndex(r => r.dataset.id === ui.sel.id), n = rows[i + (e.key === 'ArrowDown' ? 1 : -1)];
    if (n) { e.preventDefault(); rows[i]?.classList.remove('sel'); n.classList.add('sel'); ui.sel = { kind: n.dataset.kind, id: n.dataset.id }; n.scrollIntoView({ block: 'nearest' }); }
  }
});

S = load();
render();
})();
</script>
